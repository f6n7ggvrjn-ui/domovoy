<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0c1210" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <title>Домовой</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.cdnfonts.com/css/blackentina-4f" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="screen-login" class="screen active">
    <div class="login-card">
      <div class="brand">
        <div class="brand-title">ДОМОВОЙ</div>
        <p class="brand-tagline">Склад · Сумки · Оборудование</p>
      </div>
      <form id="login-form">
        <label>Учётная запись</label>
        <input id="login-id" placeholder="us000001" autocomplete="username" />
        <label>Пароль</label>
        <input id="login-pass" type="password" placeholder="••••••" autocomplete="current-password" />
        <button type="submit" class="btn btn-primary btn-block">Войти</button>
      </form>
      <div id="login-err" class="error hidden"></div>
    </div>
  </div>

  <div id="screen-app" class="screen">
    <header class="header">
      <div class="header-brand"><span class="header-title">Домовой</span></div>
      <div class="header-right">
        <span id="user-label"></span>
        <button id="btn-logout" class="btn btn-ghost btn-sm">Выйти</button>
      </div>
    </header>
    <nav id="nav" class="nav"></nav>
    <main id="content" class="content"></main>
  </div>

  <div id="toast" class="toast hidden"></div>
  
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  });
}
</script>
<script src="app.js?v=20261023pwa"></script>
</body>
</html>
