<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Домовой" />
  <meta name="theme-color" content="#0c1210" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Домовой</title>
  <link rel="stylesheet" href="styles.css?v=20261113in" />
</head>
<body>
  <div id="screen-login" class="screen active">
    <div class="login-card">
      <div class="brand">
        <div class="brand-title">ДОМОВОЙ</div>
        <p class="brand-tagline">Склад · Сумки · Оборудование</p>
      </div>
      <form id="login-form" autocomplete="on">
        <label for="login-id">Учётная запись</label>
        <input id="login-id" name="username" type="text" placeholder="us000001"
          autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <label for="login-pass">Пароль</label>
        <input id="login-pass" name="password" type="password" placeholder="Пароль"
          autocomplete="current-password" />
        <button type="submit" class="btn btn-primary btn-block">Войти</button>
      </form>
      <div id="login-err" class="error hidden"></div>
    </div>
  </div>

  <div id="screen-app" class="screen">
    <header class="header">
      <div class="header-brand"><span class="header-title">Домовой</span></div>
      <div class="header-right">
        <span id="user-label"></span>
        <button type="button" id="btn-logout" class="btn btn-ghost btn-sm">Выйти</button>
      </div>
    </header>
    <nav id="nav" class="nav"></nav>
    <main id="content" class="content"></main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (r) {
      r.forEach(function (x) { x.unregister(); });
    });
  }
  if (window.caches) {
    caches.keys().then(function (k) { k.forEach(function (n) { caches.delete(n); }); });
  }
  </script>
  <script src="app.js?v=20261113in"></script>
</body>
</html>
